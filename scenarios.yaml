# One entry per caller clip. The clip file is clips/<id>.wav (or .m4a, .mp3...).
#
# Fields:
#   id                short name, same as the clip file name
#   type              change_of_mind | code_switch | thinking_pause | interruption
#                     | long_silence | callback_request | messy_details
#   transcript        exactly what you said; use one script (e.g. romanised Tanglish) throughout
#   final_intent      what you actually wanted by the end
#   abandoned_intent  what you said first and then dropped (required for change_of_mind)
#   pauses            quiet gaps INSIDE your turn, as [start, end] in seconds (±0.5 s is fine).
#                     Not the start/end of your speech: VAD finds those automatically.
#   language          tanglish (default) | english | tamil   (english/tamil = control clips)
#   key_details       facts the agent must get right, each with accepted spellings.
#                     Checked in what the agent's speech-to-text heard. Numbers can be
#                     written as digits or words ("4" also matches "four"). Vaani's
#                     speech-to-text writes many English words in Tamil script
#                     ("Friday" as ஃப்ரைடே), so list those spellings too.
#   questions         each separate thing you asked; scored "answered or not" per question
#
# Pauses below were measured with a loudness scan (gaps >= 0.5 s, quieter than -45 dB).
# Listen to each clip and adjust if a gap is in the wrong place.

scenarios:
  - id: com_01
    type: change_of_mind
    transcript: "Hello Saturday room kedaikuma for 2 people no no not Saturday Friday rooms are available for 2?"
    final_intent: "Are there rooms available for 2 on Friday"
    abandoned_intent: "Are there rooms available for 2 on Saturday"
    key_details:
      date: [friday, ஃப்ரைடே, வெள்ளி, வெள்ளிக்கிழமை]
      guests: ["2", டூ, ரெண்டு, இரண்டு]
    questions:
      - "Are rooms available on Friday for 2 people?"
    pauses:
      - [2.60, 3.66]
      - [5.40, 6.42]

  - id: pause_01
    type: thinking_pause
    transcript: "Saturday rooms kedaikuma …. For 4 people"
    final_intent: "Are there rooms available for 4 on Saturday"
    key_details:
      date: [saturday, சாட்டர்டே, சனி, சனிக்கிழமை]
      guests: ["4", ஃபோர், நாலு, நான்கு]
    questions:
      - "Are rooms available on Saturday for 4 people?"
    pauses:
      - [4.92, 7.34]   # the thinking pause (VAD hears a faint sound at ~6.5 s)

  - id: silence_01
    type: long_silence
    transcript: "We have planned to visit yelagiri wait pannunga dates check pannitu solren ….. ah 27th October free ah irukkuma for 8 people"
    final_intent: "Are there rooms available for 8 on 27th October"
    key_details:
      place: [yelagiri, elagiri, ஏலகிரி, யெலகிரி]
      date: [27th october, october 27th, 27 october, october 27, 27 அக்டோபர், அக்டோபர் 27, 27th அக்டோபர்]
      guests: ["8", எய்ட், எட்டு]
    questions:
      - "Are rooms free on 27th October for 8 people?"
    pauses:
      - [7.14, 12.94]  # checking dates; two tiny noise blips inside, treated as one silence
      - [16.08, 16.62]

  - id: cs_01
    type: code_switch
    transcript: "Hi my name is Raghu, naanga yelagiri visit panlam solli plan pannirukom ahh are there rooms available for 4 people adutha saturday ahh check in vanthu oru 8 30 ku 8 30 morning panra maari irukkum early check in allowed ah illa should we pay extra for that and also let us know the total tariff and evalo pay pannanum nu solli our quote anuchinga na nalla irukkum"
    final_intent: "Are there rooms available for 4 on next Saturday and if early check-in at 8:30am is free of cost or paid. Also request for a tariff for the rooms."
    key_details:
      name: [raghu, ரகு, ராகு]
      place: [yelagiri, elagiri, ஏலகிரி, யெலகிரி]
      date: [next saturday, adutha saturday, coming saturday, அடுத்த சாட்டர்டே, அடுத்த saturday, adutha சாட்டர்டே, next சாட்டர்டே]
      guests: ["4", ஃபோர், நாலு, நான்கு]
      check_in_time: ["8:30", "8 30"]
    questions:
      - "Are rooms available for 4 people next Saturday?"
      - "Is early check-in at 8:30 am allowed?"
      - "Is there an extra charge for early check-in?"
      - "What is the total tariff / how much do we pay?"
      - "Can you send a quote?"
    pauses:
      - [3.84, 4.38]
      - [8.60, 9.28]
      - [12.08, 13.06]
      - [14.56, 16.14]
      - [19.32, 19.84]
      - [22.68, 24.18]
      - [26.34, 27.26]
      - [28.02, 28.68]
      - [29.92, 30.86]
      - [32.66, 33.88]
      - [36.64, 37.54]
