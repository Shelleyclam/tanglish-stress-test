[project]
name = "tanglish-stress-test"
version = "0.1.0"
description = "Stress-test voice agents with Tamil-English (Tanglish) callers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",  # bundles an ffmpeg binary, so no system install needed
    "webrtcvad-wheels>=2.0",  # voice activity detection; prebuilt for Windows too
    "jiwer>=3.0",  # word error rate
    "psutil>=5.9",  # free-RAM check before runs
]

[project.optional-dependencies]
# The local baseline agent (big downloads: Whisper + Piper models).
local = ["faster-whisper>=1.0", "piper-tts>=1.3"]
# Vaani over WebRTC: their REST SDK starts the call, LiveKit carries the audio.
vaani = ["vaani-sdk>=0.3.1", "livekit>=1.0", "python-dotenv>=1.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tanglish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
